<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo per Leo ❤️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="giftBox" class="gift-box" aria-label="Apri regalo">
    <div class="bow-container">
      <div class="bow-loop left"></div>
      <div class="bow-loop right"></div>
      <div class="bow-knot"></div>
    </div>
    
    <div class="ribbon-vertical"></div>
    <div class="ribbon-horizontal"></div>

    <div class="logo-wrapper">
      <img src="images/logo.lb.jpg" alt="Logo LB" class="gift-logo">
    </div>
  </button>

  <div id="overlay" class="overlay">
    <button id="close" aria-label="Chiudi">✕</button>
    <div id="tickets" class="tickets-content"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
