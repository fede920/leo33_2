<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo per Leo ❤️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="giftBox" class="gift-box" aria-label="Apri regalo">
    <svg class="gift-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 7.5c-1.5-2.5-4-3-5.5-1.5S5 8.5 7 10c2 1.5 5 2 5 2s3-.5 5-2 2.5-2.5 1-4-4-1-5.5 1.5z"/>
      <rect x="3" y="10" width="18" height="4" rx="1" fill="#ffffff"/>
      <rect x="4" y="14" width="16" height="8" rx="1" fill="#ffffff"/>
      <path d="M12 10v12" />
    </svg>
    
    <img src="images/logo.lb.jpg" alt="Logo LB" class="gift-logo">
  </button>

  <div id="overlay" class="overlay">
    <button id="close" aria-label="Chiudi">✕</button>
    <div id="tickets"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
